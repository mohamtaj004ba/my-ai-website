name: CallerCore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: callercore-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/development-verification.cjs --plan --base "$QUALITY_BASE"
  agent-operations-storage:
    needs: selection
    if: needs.selection.outputs.lane == 'STRICT'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      disposable-redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disposable Redis atomicity and mock orchestration
        run: node --test tests/agent-operations-redis.integration.cjs
  test:
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source-derived verification (mandatory contract tests included once in STRICT full suite)
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/development-verification.cjs --run --base "$QUALITY_BASE"
