name: CallerCore Preview Browser QA

on:
  push:
    branches:
      - feature/callercore-dashboards
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  checks: read
  actions: read

concurrency:
  group: callercore-preview-browser-qa
  cancel-in-progress: true

jobs:
  authenticated-preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://my-ai-website-git-feature-caller-d75cb2-mohamtaj004bas-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      CALLERCORE_QA_EMAIL: preview-qa@callercore.test
      CALLERCORE_VERIFY_GPT: 'false' # Paid verification requires separate authorization.
      QUALITY_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
      PREVIOUS_QA_DIR: /tmp/previous-qa

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Preview automation secret
        shell: bash
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Add the Vercel Protection Bypass secret to GitHub Actions as VERCEL_AUTOMATION_BYPASS_SECRET."
            exit 1
          fi

      - name: Set up Node for browser QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select source-derived browser scope
        id: selection
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            QUALITY_BASE="$(git rev-parse HEAD^)"
            echo "QUALITY_BASE=$QUALITY_BASE" >> "$GITHUB_ENV"
            node scripts/development-verification.cjs --strict-plan --base "$QUALITY_BASE"
          else
            node scripts/development-verification.cjs --plan --base "$QUALITY_BASE"
          fi

      - name: Pin browser QA to the exact Preview build
        shell: bash
        run: |
          node scripts/preview-release-pin.cjs

      - name: Cache npm downloads
        if: steps.selection.outputs.browser != 'identity'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-callercore-qa-npm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-callercore-qa-npm-

      - name: Install pinned QA dependencies
        id: qa-deps
        run: npm ci --ignore-scripts
        if: steps.selection.outputs.browser != 'identity'

      - name: Cache Playwright browser
        if: steps.selection.outputs.browser != 'identity'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install Chromium system dependencies
        if: steps.selection.outputs.browser != 'identity'
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.selection.outputs.browser != 'identity' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Restore previous successful visual baseline
        if: steps.selection.outputs.browser != 'identity'
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p "$PREVIOUS_QA_DIR"
          previous_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/preview-browser-qa.yml/runs?branch=feature%2Fcallercore-dashboards&status=success&per_page=10" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -z "$previous_run" ]; then
            echo "No previous successful Preview QA run available."
            exit 0
          fi
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/artifacts" --jq '.artifacts[] | select(.name | startswith("caller-core-preview-browser-qa-")) | .id' | head -n 1)"
          if [ -z "$artifact_id" ]; then
            echo "Previous QA run has no compatible artifact."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/previous-qa.zip
          unzip -q /tmp/previous-qa.zip -d "$PREVIOUS_QA_DIR"
          echo "Restored visual baseline from run $previous_run."

      - name: Run affected public presentation QA
        if: steps.selection.outputs.browser == 'affected'
        run: node scripts/affected-public-qa.mjs

      - name: Documentation identity verification only
        if: steps.selection.outputs.browser == 'identity'
        run: echo "No application visual changes; exact deployment identity verified. Screenshots not required; no fresh visual acceptance claimed."

      - name: Run authenticated client and admin QA
        if: steps.selection.outputs.browser == 'full'
        run: npm run qa:preview

      - name: Compare visual drift
        if: always() && steps.qa-deps.outcome == 'success' && steps.selection.outputs.browser == 'full'
        continue-on-error: true
        run: node scripts/visual-diff.mjs qa-artifacts "$PREVIOUS_QA_DIR"

      - name: Upload QA screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caller-core-preview-browser-qa-${{ github.run_id }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
