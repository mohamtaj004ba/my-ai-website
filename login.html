<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — CallerCore</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/logo-icon.png"><link rel="stylesheet" href="/dashboard.css"><style>
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f5f7}.login-card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:30px}.login-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#151719;font-size:24px;margin-bottom:24px}.login-brand img{width:34px}.login-card h1{font-size:32px;letter-spacing:-.04em;margin:0 0 8px}.login-card p{color:#6c7178;line-height:1.55}.login-card label{display:grid;gap:7px;font-size:12px;color:#6c7178;margin-top:24px}.login-card input{border:1px solid #d7dbe0;border-radius:10px;padding:13px;font:inherit}.login-card button{width:100%;margin-top:12px}.login-status{min-height:20px;margin-top:12px;font-size:12px;color:#17845b}.login-card input{min-height:48px;font-size:16px}.login-card label,.login-status{font-size:14px}.login-card button{min-height:48px}.login-help{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #e1e5e3;padding-top:20px;margin-top:24px;font-size:14px}.login-help a{color:#9b4327;text-underline-offset:4px}.login-card{box-shadow:0 18px 60px #1833290a}.login-shell{background:radial-gradient(ellipse at 50% 15%,#e6eee7,transparent 65%),#f8faf7}@media(max-width:400px){.login-shell{padding:16px}.login-card{padding:24px}.login-card h1{font-size:28px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.login-shell{background:#f4f6f3;padding:48px 24px}.login-card{width:min(480px,100%);padding:40px;border:1px solid #dfe5df;border-radius:24px;box-shadow:0 12px 40px #18332908}.login-brand{font-size:22px;margin-bottom:36px}.login-card .eyebrow{font-size:11px;letter-spacing:.13em;color:#67766d}.login-card h1{font-size:36px;margin-top:12px}.login-card p{color:#58675f;font-size:15px}.login-card label{color:#43554b;font-weight:500}.login-card :is(input,textarea){width:100%;box-sizing:border-box;border:1px solid #cad5cc;border-radius:10px;padding:13px;background:#fafcf9;color:#203c33;font:inherit;font-size:16px}.login-card :is(input,textarea):focus-visible{outline:2px solid #ac4829;outline-offset:3px}.login-card button.primary{background:#a7472b;color:#fff;border:0;border-radius:10px;font:600 15px inherit;cursor:pointer}.login-card button:disabled{opacity:.65;cursor:wait}.login-help{border:0;margin-top:18px;padding-top:0;align-items:center;font-size:12px;gap:12px}.login-help a,.login-help #helpToggle{color:#65736a;font:inherit;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.login-help #helpToggle{width:auto;background:transparent;border:0;padding:0;margin:0;text-align:right;cursor:pointer}.login-help :is(a,button):hover{color:#243e30;text-decoration:underline}.login-help :is(a,button):focus-visible{outline:2px solid #ac4829;outline-offset:3px}.login-support{border-top:1px solid #dfe5df;margin-top:18px;padding-top:24px}.login-support[hidden]{display:none}.login-support h2{font-size:22px;letter-spacing:-.03em;margin:0}.login-support label{margin-top:16px}.login-support .support-hint{font-size:12px;margin:8px 0}.login-status[data-state=error]{color:#a03626}.login-status[data-state=success]{color:#286344}@media(max-width:520px){.login-shell{padding:24px 16px}.login-card{padding:28px 22px}.login-brand{margin-bottom:26px}.login-card h1{font-size:32px}.login-help{flex-wrap:wrap}}
</style><link rel="stylesheet" href="/customer-experience.css"></head><body><main class="login-shell"><section class="login-card"><a class="login-brand" href="/"><img src="/logo-icon.png" alt=""><span>Caller<b>Core</b></span></a><span class="eyebrow">Client portal</span><h1>Welcome back.</h1><p>Use your account email to receive a secure sign-in link.</p><form id="loginForm"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@business.com"></label><button class="primary" id="submit" type="submit">Send sign-in link</button><div class="login-status" id="status" role="status"></div></form><div class="login-help"><a href="/">Back to website</a><button type="button" id="helpToggle" aria-expanded="false" aria-controls="loginSupport">Having trouble signing in?</button></div><section id="loginSupport" class="login-support" hidden aria-labelledby="supportTitle"><h2 id="supportTitle">Let’s help you get in.</h2><p>Tell us what happened. We’ll reply by email.</p><form id="supportForm"><label for="supportName">Your name<input id="supportName" name="name" autocomplete="name" maxlength="120" required></label><label for="supportEmail">Reply email<input id="supportEmail" name="email" type="email" autocomplete="email" maxlength="200" required></label><label for="supportMessage">What’s happening?<textarea id="supportMessage" name="message" rows="3" maxlength="4000" placeholder="For example, my sign-in link hasn’t arrived." required></textarea></label><p class="support-hint">Please leave out passwords and sign-in links.</p><button class="primary" id="supportSubmit" type="submit">Send help request</button><p class="login-status" id="supportStatus" role="status" aria-live="polite"></p></form></section></section></main><script>
const p=new URLSearchParams(location.search),status=document.getElementById('status'),next=['/admin-dashboard','/dashboard'].includes(p.get('next'))?p.get('next'):'';
if(next==='/admin-dashboard'){document.querySelector('.eyebrow').textContent='Admin portal';document.querySelector('.login-card p').textContent='Use your admin account email to receive a secure sign-in link.'}
if(p.get('error')){status.dataset.state='error';status.textContent=p.get('error')==='expired'?'That sign-in link expired. Request a new one.':'That sign-in link is no longer available. Request a fresh link below.';}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Sending…';status.textContent='';status.dataset.state='';try{const r=await fetch('/api/account?action=request',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,next})});const data=await r.json().catch(()=>null);if(!r.ok||!data||typeof data!=='object'||Array.isArray(data)||data.ok!==true)throw new Error();status.dataset.state='success';status.textContent='If that email is linked to a CallerCore account, a sign-in link is on the way.'}catch(_){status.dataset.state='error';status.textContent='We could not send a sign-in link right now. Please try again.'}btn.disabled=false;btn.textContent='Send sign-in link'});</script><script src="/login-support.js" defer></script></body></html>
