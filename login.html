<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — CallerCore</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/logo-icon.png"><link rel="stylesheet" href="/dashboard.css"><style>
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f5f7}.login-card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:30px}.login-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#151719;font-size:24px;margin-bottom:24px}.login-brand img{width:34px}.login-card h1{font-size:32px;letter-spacing:-.04em;margin:0 0 8px}.login-card p{color:#6c7178;line-height:1.55}.login-card label{display:grid;gap:7px;font-size:12px;color:#6c7178;margin-top:24px}.login-card input{border:1px solid #d7dbe0;border-radius:10px;padding:13px;font:inherit}.login-card button{width:100%;margin-top:12px}.login-status{min-height:20px;margin-top:12px;font-size:12px;color:#17845b}</style></head><body><main class="login-shell"><section class="login-card"><a class="login-brand" href="/"><img src="/logo-icon.png" alt=""><span>Caller<b>Core</b></span></a><span class="eyebrow">Client portal</span><h1>Sign in to CallerCore.</h1><p>Enter the email attached to your CallerCore account. We’ll send you a secure sign-in link.</p><form id="loginForm"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@business.com"></label><button class="primary" id="submit" type="submit">Email me a sign-in link</button><div class="login-status" id="status" role="status"></div></form></section></main><script>
const p=new URLSearchParams(location.search),status=document.getElementById('status');if(p.get('error'))status.textContent=p.get('error')==='expired'?'That sign-in link expired. Request a new one.':'That sign-in link is invalid.';
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Sending…';status.textContent='';try{const r=await fetch('/api/account?action=request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});if(!r.ok)throw new Error();status.textContent='If that email is linked to a CallerCore account, a sign-in link is on the way.'}catch(_){status.textContent='We could not send a sign-in link right now. Please try again.'}btn.disabled=false;btn.textContent='Email me a sign-in link'});</script></body></html>
