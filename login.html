<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — CallerCore</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/logo-icon.png"><link rel="stylesheet" href="/dashboard.css"><style>
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f5f7}.login-card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:30px}.login-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#151719;font-size:24px;margin-bottom:24px}.login-brand img{width:34px}.login-card h1{font-size:32px;letter-spacing:-.04em;margin:0 0 8px}.login-card p{color:#6c7178;line-height:1.55}.login-card label{display:grid;gap:7px;font-size:12px;color:#6c7178;margin-top:24px}.login-card input{border:1px solid #d7dbe0;border-radius:10px;padding:13px;font:inherit}.login-card button{width:100%;margin-top:12px}.login-status{min-height:20px;margin-top:12px;font-size:12px;color:#17845b}.login-card input{min-height:48px;font-size:16px}.login-card label,.login-status{font-size:14px}.login-card button{min-height:48px}.login-help{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #e1e5e3;padding-top:20px;margin-top:24px;font-size:14px}.login-help a{color:#9b4327;text-underline-offset:4px}.login-card{box-shadow:0 18px 60px #1833290a}.login-shell{background:radial-gradient(ellipse at 50% 15%,#e6eee7,transparent 65%),#f8faf7}@media(max-width:400px){.login-shell{padding:16px}.login-card{padding:24px}.login-card h1{font-size:28px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style><link rel="stylesheet" href="/customer-experience.css"></head><body><main class="login-shell"><section class="login-card"><a class="login-brand" href="/"><img src="/logo-icon.png" alt=""><span>Caller<b>Core</b></span></a><span class="eyebrow">Client portal</span><h1>Sign in to CallerCore.</h1><p>Enter the email attached to your CallerCore account. We’ll send you a secure sign-in link.</p><form id="loginForm"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@business.com"></label><button class="primary" id="submit" type="submit">Email me a sign-in link</button><div class="login-status" id="status" role="status"></div></form><div class="login-help"><a href="/">Back to website</a><a href="/contact">Need help?</a></div></section></main><script>
const p=new URLSearchParams(location.search),status=document.getElementById('status'),next=['/admin-dashboard','/dashboard'].includes(p.get('next'))?p.get('next'):'';
if(next==='/admin-dashboard'){document.querySelector('.eyebrow').textContent='Admin portal';document.querySelector('.login-card p').textContent='Enter the email attached to your CallerCore admin account. We’ll send you a secure sign-in link.'}
if(p.get('error')){status.dataset.state='error';status.textContent=p.get('error')==='expired'?'That sign-in link expired. Request a new one.':'That sign-in link is no longer available. Request a fresh link below.';}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Sending…';status.textContent='';status.dataset.state='';try{const r=await fetch('/api/account?action=request',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,next})});const data=await r.json().catch(()=>null);if(!r.ok||!data||typeof data!=='object'||Array.isArray(data)||data.ok!==true)throw new Error();status.dataset.state='success';status.textContent='If that email is linked to a CallerCore account, a sign-in link is on the way.'}catch(_){status.dataset.state='error';status.textContent='We could not send a sign-in link right now. Please try again.'}btn.disabled=false;btn.textContent='Email me a sign-in link'});</script></body></html>
