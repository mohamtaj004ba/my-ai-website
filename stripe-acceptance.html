<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CallerCore sandbox acceptance</title><link rel="stylesheet" href="/styles.css"></head><body><main style="max-width:600px;margin:12vh auto;padding:24px"><h1>Sandbox acceptance</h1><p>This temporary entry is for authorized disposable test accounts. Public signup stays closed.</p><form id="entry"><label for="access">Acceptance access</label><input id="access" type="password" required autocomplete="off" style="display:block;width:100%;padding:16px;margin:20px 0"><button type="submit">Open test signup</button></form><p id="status" role="status"></p><form id="owner"><label for="receipt">Paid disposable receipt</label><input id="receipt" type="password" required autocomplete="off"><button type="submit">Open disposable owner dashboard</button></form></main><script>document.getElementById('entry').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/stripe-acceptance',{method:'POST',headers:{'Content-Type':'application/json','x-billing-acceptance':document.getElementById('access').value},body:JSON.stringify({action:'inspect'})});document.getElementById('access').value='';const d=await r.json();if(r.ok&&d.mode==='test'&&!d.publicCheckoutEnabled)location.assign('/get-started?plan=Starter');else document.getElementById('status').textContent=d.error||'Public checkout gate needs review.'});document.getElementById("owner").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/stripe-acceptance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",receipt:document.getElementById("receipt").value})});document.getElementById("receipt").value="";if(r.ok)location.assign("/dashboard");else document.getElementById("status").textContent="Paid disposable owner login could not be verified.";});</script></body></html>
